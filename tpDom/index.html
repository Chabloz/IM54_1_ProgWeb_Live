<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Playing cards — DOM</title>
    <script type="module" src="card.js"></script>
    <link rel="stylesheet" href="cards.css">
</head>
<body>
    <main>
        <h1>Playing cards</h1>
        <p>Program the buttons to select the matching cards.</p>

        <div class="controls" role="group">
            <button id="select-ace-spade">A · Ace of spades</button>
            <button id="select-hearts">B · Hearts</button>
            <button id="select-red">C · Red cards</button>
            <button id="select-face-cards">D · Face cards</button>
            <button id="select-red-face-cards">E · Red face cards</button>
            <button id="select-not-spades">F · All except spades</button>
        </div>

        <div class="deck">
            <playing-card id="HEART-ACE" class="rank-ace heart selected">
                <span class="rank">A</span>
                <span class="suit">♥</span>
            </playing-card>
            <playing-card id="HEART-2" class="rank-2 heart">
                <span class="rank">2</span>
                <span class="suit">♥</span>
            </playing-card>

            <playing-card id="HEART-QUEEN" class="rank-queen heart" data-face-card>
